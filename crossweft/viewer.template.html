function involvement() {
  // returns {blocks:Set, links:Set, primary:Set} for the current selection/search
  const res = { blocks: new Set(), links: new Set(), primary: new Set(), steps: new Map() };
  const sel = state.sel;
  if (sel) {
    if (sel.type === "block") {
      const ids = new Set(subtree(sel.id));
      for (const l of MAP.links) if (ids.has(l.from) || ids.has(l.to)) { res.links.add(l.id); res.blocks.add(l.from); res.blocks.add(l.to); }
      ids.forEach(i => { res.blocks.add(i); res.primary.add(i); });
    } else if (sel.type === "links") {
      sel.ids.forEach(id => { const l = links.get(id); res.links.add(id); res.blocks.add(l.from); res.blocks.add(l.to); });
    } else if (sel.type === "flow") {
      const f = flows.get(sel.id);
      f.steps.forEach((s, i) => {
        if (state.step !== null && state.step !== i) return;
        const l = links.get(s.link); res.links.add(l.id); res.blocks.add(l.from); res.blocks.add(l.to);
        if (!res.steps.has(l.id)) res.steps.set(l.id, []); res.steps.get(l.id).push(i + 1);
      });
    } else if (sel.type === "data") {
      const d = datas.get(sel.id);
      res.blocks.add(d.origin); res.primary.add(d.origin);
      for (const hop of (carriers.get(d.id) || [])) { res.links.add(hop.link.id); res.blocks.add(hop.src); res.blocks.add(hop.dst); }
      for (const c of (d.consumers || [])) res.blocks.add(c);
      for (const s of (d.stored_in || [])) res.blocks.add(s.block);
    } else if (sel.type === "finding") {
      const f = findings.get(sel.id);
      for (const r of (f.where || [])) {
        const [kind, id] = r.split(":");
        if (kind === "block") { res.blocks.add(id); res.primary.add(id); }
        if (kind === "link") { const l = links.get(id); res.links.add(id); res.blocks.add(l.from); res.blocks.add(l.to); }
        if (kind === "data") { const d = datas.get(id); res.blocks.add(d.origin); for (const hop of (carriers.get(id) || [])) { res.links.add(hop.link.id); res.blocks.add(hop.src); res.blocks.add(hop.dst); } }
        if (kind === "flow") { for (const s of flows.get(id).steps) { const l = links.get(s.link); res.links.add(l.id); res.blocks.add(l.from); res.blocks.add(l.to); } }
      }
    }
  }
  if (state.search) {
    const q = state.search.toLowerCase();
    for (const b of MAP.blocks) if ((b.name + " " + b.id + " " + (b.short || "") + " " + b.summary).toLowerCase().includes(q)) { res.blocks.add(b.id); res.primary.add(b.id); }
  }
  return res;
}

function writeHash() {

function readHash() {
